name: staging

# Every push to develop publishes a dev image and asks the release repo for a
# staging version PR (devops merge it to deploy staging).
on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

# Only the newest develop commit matters for staging.
concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  request-staging-deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Open the staging version PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          VERSION: ${{ needs.image.outputs.tag }}
        run: |
          gh workflow run bump-version.yml -R iubebe/ibb_shop_release \
            -f service=backend -f version="$VERSION" -f environment=staging
