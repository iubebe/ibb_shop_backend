name: develop

# Heavier checks for PRs into develop: e2e against real Postgres/Redis
# and a Docker build (no push).
on:
  pull_request:
    branches: [develop]

concurrency:
  group: develop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ibb
          POSTGRES_PASSWORD: ibb
          POSTGRES_DB: ibb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ibb"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ibb
      DB_PASSWORD: ibb
      DB_NAME: ibb
      DB_MIGRATIONS_RUN: 'true'
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      JWT_ACCESS_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      CSRF_SECRET: ci-only-csrf-secret-at-least-32-characters-long
      THROTTLE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
